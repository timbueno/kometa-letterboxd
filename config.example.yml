# Copy to a writable location (for example, config.yml) and adjust values.

username: your-letterboxd-username
request_timeout: 30
lists_cache: data/user/dated.json
refresh_lists: false

kometa:
  config_path: /path/to/kometa/config.yml

dated:
  kometa_target: /path/to/kometa/config.yml
  letterboxd_prefix: "Movie Night - "
  plex_prefix: "Martin's Movie Night - "
  days_before: 0
  collection_extra:
    label.not: "Film Club"
  extended_extra:
    summary: "Auto-generated roundup"

tagged:
  tag: plex
  extra:
    label.not: "Film Club"

random:
  collections:
    - name: "🌊 Random from TNMN"
      url: "https://letterboxd.com/tn_movienight/list/tuesday-night-movie-night-recommendations/"
      count: 10
      seed: "tnmn"
      period: "monthly"
      sync_mode: "sync"
      show_missing: true
      radarr_add_missing: true
      radarr_search: true
      radarr_folder: "/media/ephemeral-movies"
      radarr_tag:
        - "ephemeral"
        - "tnmn-random"

showdown_latest:
  count: 2
  entries: 5
  sync_mode: sync
  show_missing: true
  radarr_add_missing: true
  radarr_search: true
  radarr_folder: "/mnt/ephemeral-movies"
  radarr_tag:
    - "ephemeral"
    - "showdown"
  visible_library: true
  visible_home: true
  visible_shared: false

showdown:
  showdown_json: path/to/showdown.json
  cache_path: path/to/showdown-cache.json
  state_file: path/to/showdown-rotation.json
  threshold: 6
  sort: matches_desc
  window: 5
  label: "Showdown Spotlight"
