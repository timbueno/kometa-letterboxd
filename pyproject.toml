[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kometa-letterboxd"
version = "0.4"
description = "Generate Kometa collections from Letterboxd Showdowns and other User Lists"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Wyatt Brege", email = "wyatt@brege.org" },
]
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.2",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "plexapi>=4.17.1",
  "cloudscraper>=1.2.71",
  "pydantic>=2.0",
]

[project.optional-dependencies]
posters = [
  "Pillow>=10.0",
]

[project.urls]
Repository = "https://github.com/brege/kometa-letterboxd"

[project.scripts]
kometa-letterboxd = "kometa_letterboxd.main:main"

[dependency-groups]
dev = [
  "ty>=0.0.18",
]

[tool.ty.src]
include = ["kometa_letterboxd"]
respect-ignore-files = true

[tool.hatch.build.targets.wheel]
packages = ["kometa_letterboxd"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E203"]

[tool.ruff.lint.isort]
split-on-trailing-comma = true
